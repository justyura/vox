services:
  minio:
    image: minio/minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - ./minio-data:/data
  userdb:
    image: postgres:16-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vox
      POSTGRES_PASSWORD: vox
      POSTGRES_DB: vox
    volumes:
      - userdata:/var/lib/postgresql/data

  filedb:
    image: postgres:16-alpine
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: vox
      POSTGRES_PASSWORD: vox
      POSTGRES_DB: vox
    volumes:
      - filedata:/var/lib/postgresql/data

  taskdb:
    image: postgres:16-alpine
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: vox
      POSTGRES_PASSWORD: vox
      POSTGRES_DB: vox
    volumes:
      - taskdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:management-alpine
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: vox
      RABBITMQ_DEFAULT_PASS: vox
    volumes:
      - rabbitmq:/var/lib/rabbitmq

  api:
    image: vox-api:dev
    restart: always
    ports:
      - "8081:8081"
    environment:
      JWT_SECRET_KEY: devsecret
      USER_DATABASE_URL: postgres://vox:vox@userdb:5432/vox?sslmode=disable
      FILE_SERVICE_ADDR: file:50051
      TASK_SERVICE_ADDR: task:50052

  file:
    image: vox-file:dev
    restart: always
    ports:
      - "50051:50051"
    environment:
      DATABASE_URL: postgres://vox:vox@filedb:5432/vox
      BLOB_BACKEND: ${BLOB_BACKEND:-minio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESSKEY: minioadmin
      MINIO_SECRETACCESSKEY: minioadmin
      MINIO_BUCKET: vox
      ALIYUN_REGION: ${ALIYUN_REGION:-}
      ALIYUN_ENDPOINT: ${ALIYUN_ENDPOINT:-}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_BUCKET: ${ALIYUN_BUCKET:-}
      PRESIGN_TTL: 24h

  task:
    image: vox-task:dev
    restart: always
    ports:
      - "50052:50052"
    environment:
      DATABASE_URL: postgres://vox:vox@taskdb:5432/vox?sslmode=disable
      FILE_SERVICE_ADDR: file:50051
      RABBITMQ_ADDR: amqp://vox:vox@rabbitmq:5672

  worker:
    image: vox-worker:dev
    restart: always
    environment:
      TASK_SERVER_ADDR: task:50052
      RABBITMQ_ADDR: amqp://vox:vox@rabbitmq:5672


volumes:
  userdata:
  filedata:
  taskdata:
  rabbitmq:


